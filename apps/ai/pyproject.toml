[project]
name = "abc-ai-service"
version = "0.1.0"
description = "ABC Express AI Decision Service (Deep Agents / LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "redis>=5.2.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "langchain>=1.2.0",
    "langgraph>=1.1.0",
    "langchain-anthropic>=0.3.0",
    "deepagents>=0.5.0",
    "anthropic>=0.42.0",
]

[project.optional-dependencies]
sandbox = [
    "langchain-daytona>=0.0.5",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF", "G"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true